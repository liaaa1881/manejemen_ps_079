<div class="container-fluid">

  <div class="card shadow mb-4">

          <thead class="thead-dark"><tr>

<datalist id="listJurusan"><option value="Teknik Informatika"><option value="Teknik Komputer"><option value="Sistem Informasi"><option value="Teknologi Informasi"><option value="Sains Data"><option value="Rekayasa Perangkat Lunak"><option value="Robotika"></datalist>

<script src="vendor/jquery/jquery.min.js"></script>
<script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="vendor/jquery-easing/jquery.easing.min.js"></script>
<script src="js/sb-admin-2.min.js"></script>
<script src="vendor/datatables/jquery.dataTables.min.js"></script>
<script src="vendor/datatables/dataTables.bootstrap4.min.js"></script>
<script src="js/api.js"></script>
<script>
(function () {
  "use strict";
  const COLS = 8;
  let editId = null;
  let hapusId = null;

  /* ---------------------------------------------------------- READ (index) */
  async function muatData() {
    drawTable("#dataTable", loadingRow(COLS));
    try {
      const rows = await api.get("/mahasiswa/read.php");
      const data = Array.isArray(rows) ? rows : [];
      if (!data.length) {
        drawTable("#dataTable", emptyRow(COLS, "Belum ada mahasiswa. Klik \"Tambah Mahasiswa\"."));
        return;
      }
      const html = data.map(function (r, i) {
        return "<tr>" +
          "<td>" + (i + 1) + "</td>" +
          "<td><code>" + escapeHtml(r.nim) + "</code></td>" +
          "<td><strong>" + escapeHtml(r.nama) + "</strong><br><small class='text-muted'>ID: " + escapeHtml(r.id) + "</small></td>" +
          "<td>" + escapeHtml(r.jurusan) + "</td>" +
          "<td class='text-center'>" + escapeHtml(r.angkatan) + "</td>" +
          "<td><a href='mailto:" + escapeHtml(r.email) + "' class='text-primary'>" + escapeHtml(r.email) + "</a></td>" +
          "<td>" + escapeHtml(r.telepon) + "</td>" +
          "<td class='text-center'>" +
            "<button class='btn btn-info btn-sm btn-detail' data-id='" + escapeHtml(r.id) + "' title='Detail'><i class='fas fa-eye'></i></button> " +
            "<button class='btn btn-warning btn-sm btn-edit' data-id='" + escapeHtml(r.id) + "' title='Edit'><i class='fas fa-edit'></i></button> " +
            "<button class='btn btn-danger btn-sm btn-hapus' data-id='" + escapeHtml(r.id) + "' data-nama='" + escapeHtml(r.nama) + "' title='Hapus'><i class='fas fa-trash'></i></button>" +
          "</td></tr>";
      }).join("");
      drawTable("#dataTable", html);
    } catch (e) {
      drawTable("#dataTable", errorRow(COLS, e.message));
      showToast(e.message, "danger");
    }
  }

  /* -------------------------------------------------------------- CREATE */
  function bukaTambah() {
    editId = null;
    resetForm("formMhs");
    $("#formModalTitle").html('<i class="fas fa-plus-circle mr-1"></i> Tambah Mahasiswa');
    $("#btnSimpan").html('<i class="fas fa-save mr-1"></i> Simpan');
    $("#formModal").modal("show");
  }

  /* --------------------------------------------------------------- UPDATE */
  function bukaEdit(id) {
    api.get("/mahasiswa/detail.php", { id: id }).then(function (r) {
      editId = r.id;
      setFormValues("formMhs", r);
      $("#formModalTitle").html('<i class="fas fa-edit mr-1"></i> Edit Mahasiswa #' + escapeHtml(r.id));
      $("#btnSimpan").html('<i class="fas fa-save mr-1"></i> Perbarui');
      $("#formModal").modal("show");
    }).catch(function (e) { showToast(e.message, "danger"); });
  }

  /* --------------------------------------------------------------- DELETE */
  function bukaHapus(id, nama) {
    hapusId = id;
    $("#hapusNama").text(nama);
    $("#hapusModal").modal("show");
  }

  /* --------------------------------------------------------------- DETAIL */
  function bukaDetail(id) {
    $("#detailBody").html('<div class="text-center py-3"><i class="fas fa-spinner fa-spin"></i> Memuat...</div>');
    $("#detailModal").modal("show");
    api.get("/mahasiswa/detail.php", { id: id }).then(function (r) {
      $("#detailBody").html(
        '<table class="table table-sm table-bordered mb-0">' +
        '<tr><th style="width:40%">ID</th><td><code>' + escapeHtml(r.id) + '</code></td></tr>' +
        '<tr><th>NIM</th><td><code>' + escapeHtml(r.nim) + '</code></td></tr>' +
        '<tr><th>Nama</th><td>' + escapeHtml(r.nama) + '</td></tr>' +
        '<tr><th>Jurusan</th><td>' + escapeHtml(r.jurusan) + '</td></tr>' +
        '<tr><th>Angkatan</th><td>' + escapeHtml(r.angkatan) + '</td></tr>' +
        '<tr><th>Email</th><td>' + escapeHtml(r.email) + '</td></tr>' +
        '<tr><th>Telepon</th><td>' + escapeHtml(r.telepon) + '</td></tr>' +
        '<tr><th>Terdaftar</th><td>' + formatDate(r.created_at) + '</td></tr>' +
        '</table>'
      );
    }).catch(function (e) {
      $("#detailBody").html('<div class="alert alert-danger mb-0">' + escapeHtml(e.message) + "</div>");
    });
  }

  /* ------------------------------------------------------ submit form */
  $("#formMhs").on("submit", function (ev) {
    ev.preventDefault();
    const body = getFormValues("formMhs");
    if (editId !== null) body.id = editId;

    const url = editId !== null ? "/mahasiswa/update.php" : "/mahasiswa/create.php";
    $("#btnSimpan").prop("disabled", true).html('<i class="fas fa-spinner fa-spin mr-1"></i> Menyimpan...');

    api.post(url, body).then(function (res) {
      showToast((res && res.message) || "Data berhasil disimpan.", "success");
      $("#formModal").modal("hide");
      muatData();
    }).catch(function (e) {
      showToast(e.message, "danger");
    }).finally(function () {
      $("#btnSimpan").prop("disabled", false).html(
        editId !== null ? '<i class="fas fa-save mr-1"></i> Perbarui' : '<i class="fas fa-save mr-1"></i> Simpan'
      );
    });
  });

  $("#btnHapusYa").on("click", function () {
    const id = hapusId;
    $("#btnHapusYa").prop("disabled", true);
    api.del("/mahasiswa/delete.php", { id: id }).then(function (res) {
      showToast((res && res.message) || "Data dihapus.", "success");
      $("#hapusModal").modal("hide");
      muatData();
    }).catch(function (e) {
      showToast(e.message, "danger");
    }).finally(function () {
      $("#btnHapusYa").prop("disabled", false);
      hapusId = null;
    });
  });

  /* ------------------------------------------------------ event delegation */
  $("#dataTable").on("click", ".btn-edit", function () { bukaEdit(this.dataset.id); });
  $("#dataTable").on("click", ".btn-hapus", function () { bukaHapus(this.dataset.id, this.dataset.nama); });
  $("#dataTable").on("click", ".btn-detail", function () { bukaDetail(this.dataset.id); });
  $("#btnTambah").on("click", bukaTambah);
  $("#btnMuatUlang").on("click", muatData);

  /* ----------------------------------------------------------- cek kesehatan API */
  api.get("/mahasiswa/read.php").then(function (d) {
    $("#apiStatus").html('<i class="fas fa-circle text-success"></i> API Terhubung &middot; ' + (Array.isArray(d) ? d.length : 0) + ' data');
  }).catch(function (e) {
    $("#apiStatus").html('<i class="fas fa-circle text-danger"></i> API Error');
    showToast(e.message, "danger");
  });

  muatData();
})();
</script>
