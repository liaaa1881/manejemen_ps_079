<li class="nav-item"><a class="nav-link" href="index.html"><i class="fas fa-fw fa-tachometer-alt"></i> <span>Dashboard</span></a></li>
<hr class="sidebar-divider"><div class="sidebar-heading">Master Data</div>
<li class="nav-item"><a class="nav-link" href="prodi.html"><i class="fas fa-fw fa-university"></i> <span>Master Data Prodi</span></a></li>

<div id="content-wrapper" class="d-flex flex-column"><div id="content">
<nav class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top shadow">
<button id="sidebarToggleTop" class="btn btn-link d-md-none rounded-circle mr-3"><i class="fa fa-bars"></i></button>
<ul class="navbar-nav ml-auto"><li class="nav-item"><a class="nav-link" href="#"><span class="mr-2 d-none d-lg-inline small text-gray-600">Dr. Dosen Pengampuh, M.Kom</span>
<img class="img-profile rounded-circle" src="img/undraw_profile.svg"></a></li></ul></nav>

<div class="container-fluid">
<script src="js/sb-admin-2.min.js"></script>
<script src="vendor/datatables/jquery.dataTables.min.js"></script>
<script src="vendor/datatables/dataTables.bootstrap4.min.js"></script>
<script src="js/api.js"></script>
<script>
(function () {
  "use strict";
  const COLS = 8;
  let editId = null;   // null = mode Create, terisi = mode Update
  let hapusId = null;

  /* ---------------------------------------------------------- READ (index) */
  async function muatData() {
    drawTable("#dataTable", loadingRow(COLS));
    try {
      const rows = await api.get("/asset/read.php");
      const data = Array.isArray(rows) ? rows : [];
      if (!data.length) {
        drawTable("#dataTable", emptyRow(COLS, "Belum ada asset. Klik \"Tambah Asset\"."));
        return;
      }
      const html = data.map(function (r, i) {
        return "<tr>" +
          "<td>" + (i + 1) + "</td>" +
          "<td><strong>" + escapeHtml(r.nama_asset) + "</strong><br><small class='text-muted'>ID: " + escapeHtml(r.id) + "</small></td>" +
          "<td>" + escapeHtml(r.kategori) + "</td>" +
          "<td class='text-center'>" + escapeHtml(r.jumlah) + "</td>" +
          "<td>" + statusBadge(r.kondisi) + "</td>" +
          "<td>" + escapeHtml(r.lokasi) + "</td>" +
          "<td>" + statusBadge(r.status) + "</td>" +
          "<td class='text-center'>" +
            "<button class='btn btn-info btn-sm btn-detail' data-id='" + escapeHtml(r.id) + "' title='Detail'><i class='fas fa-eye'></i></button> " +
            "<button class='btn btn-warning btn-sm btn-edit' data-id='" + escapeHtml(r.id) + "' title='Edit'><i class='fas fa-edit'></i></button> " +
            "<button class='btn btn-danger btn-sm btn-hapus' data-id='" + escapeHtml(r.id) + "' data-nama='" + escapeHtml(r.nama_asset) + "' title='Hapus'><i class='fas fa-trash'></i></button>" +
          "</td></tr>";
      }).join("");
      drawTable("#dataTable", html);
    } catch (e) {
      drawTable("#dataTable", errorRow(COLS, e.message));
      showToast(e.message, "danger");
    }
  }

  /* -------------------------------------------------------------- CREATE */
  function bukaTambah() {
    editId = null;
    resetForm("formAsset");
    $("#formModalTitle").html('<i class="fas fa-plus-circle mr-1"></i> Tambah Asset');
    $("#btnSimpan").html('<i class="fas fa-save mr-1"></i> Simpan');
    $("#formModal").modal("show");
  }

  /* --------------------------------------------------------------- UPDATE */
  function bukaEdit(id) {
    api.get("/asset/detail.php", { id: id }).then(function (r) {
      editId = r.id;
      setFormValues("formAsset", r);
      $("#formModalTitle").html('<i class="fas fa-edit mr-1"></i> Edit Asset #' + escapeHtml(r.id));
      $("#btnSimpan").html('<i class="fas fa-save mr-1"></i> Perbarui');
      $("#formModal").modal("show");
    }).catch(function (e) { showToast(e.message, "danger"); });
  }

  /* --------------------------------------------------------------- DELETE */
  function bukaHapus(id, nama) {
    hapusId = id;
    $("#hapusNama").text(nama);
    $("#hapusModal").modal("show");
  }

  /* --------------------------------------------------------------- DETAIL */
  function bukaDetail(id) {
    $("#detailBody").html('<div class="text-center py-3"><i class="fas fa-spinner fa-spin"></i> Memuat...</div>');
    $("#detailModal").modal("show");
    api.get("/asset/detail.php", { id: id }).then(function (r) {
      $("#detailBody").html(
        '<table class="table table-sm table-bordered mb-0">' +
        '<tr><th style="width:40%">ID</th><td><code>' + escapeHtml(r.id) + '</code></td></tr>' +
        '<tr><th>Nama Asset</th><td>' + escapeHtml(r.nama_asset) + '</td></tr>' +
        '<tr><th>Kategori</th><td>' + escapeHtml(r.kategori) + '</td></tr>' +
        '<tr><th>Jumlah</th><td>' + escapeHtml(r.jumlah) + '</td></tr>' +
        '<tr><th>Kondisi</th><td>' + statusBadge(r.kondisi) + '</td></tr>' +
        '<tr><th>Lokasi</th><td>' + escapeHtml(r.lokasi) + '</td></tr>' +
        '<tr><th>Status</th><td>' + statusBadge(r.status) + '</td></tr>' +
        '<tr><th>Dibuat</th><td>' + formatDate(r.created_at) + '</td></tr>' +
        '</table>'
      );
    }).catch(function (e) {
      $("#detailBody").html('<div class="alert alert-danger mb-0">' + escapeHtml(e.message) + "</div>");
    });
  }

  /* ------------------------------------------------------ submit form */
  $("#formAsset").on("submit", function (ev) {
    ev.preventDefault();
    const body = getFormValues("formAsset");
    if (editId !== null) body.id = editId;

    const url = editId !== null ? "/asset/update.php" : "/asset/create.php";
    $("#btnSimpan").prop("disabled", true).html('<i class="fas fa-spinner fa-spin mr-1"></i> Menyimpan...');

    api.post(url, body).then(function (res) {
      showToast((res && res.message) || "Data berhasil disimpan.", "success");
      $("#formModal").modal("hide");
      muatData();
    }).catch(function (e) {
      showToast(e.message, "danger");
    }).finally(function () {
      $("#btnSimpan").prop("disabled", false).html(
        editId !== null ? '<i class="fas fa-save mr-1"></i> Perbarui' : '<i class="fas fa-save mr-1"></i> Simpan'
      );
    });
  });

  $("#btnHapusYa").on("click", function () {
    const id = hapusId;
    $("#btnHapusYa").prop("disabled", true);
    api.del("/asset/delete.php", { id: id }).then(function (res) {
      showToast((res && res.message) || "Data dihapus.", "success");
      $("#hapusModal").modal("hide");
      muatData();
    }).catch(function (e) {
      showToast(e.message, "danger");
    }).finally(function () {
      $("#btnHapusYa").prop("disabled", false);
      hapusId = null;
    });
  });

  /* ------------------------------------------------------ event delegation */
  $("#dataTable").on("click", ".btn-edit", function () { bukaEdit(this.dataset.id); });
  $("#dataTable").on("click", ".btn-hapus", function () { bukaHapus(this.dataset.id, this.dataset.nama); });
  $("#dataTable").on("click", ".btn-detail", function () { bukaDetail(this.dataset.id); });
  $("#btnTambah").on("click", bukaTambah);
  $("#btnMuatUlang").on("click", muatData);

  /* ----------------------------------------------------------- cek kesehatan API */
  api.get("/asset/read.php").then(function (d) {
    $("#apiStatus").html('<i class="fas fa-circle text-success"></i> API Terhubung &middot; ' + (Array.isArray(d) ? d.length : 0) + ' data');
  }).catch(function (e) {
    $("#apiStatus").html('<i class="fas fa-circle text-danger"></i> API Error');
    showToast(e.message, "danger");
  });

  muatData();
})();
</script>
</body></html>
